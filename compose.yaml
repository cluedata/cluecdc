name: cluecdc

services:
  metadata-db:
    image: postgres:17.9
    restart: unless-stopped
    environment:
      POSTGRES_DB: cluecdc
      POSTGRES_USER: cluecdc
      POSTGRES_PASSWORD: ${METADATA_PASSWORD:?Copy .env.example to .env or run python scripts/bootstrap.py}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluecdc -d cluecdc"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  cluecdc-api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      args:
        INSTALL_DEV: "false"
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_MODE: ${AUTH_MODE:-developer}
      AUTH_TOKENS_JSON: ${AUTH_TOKENS_JSON:-{}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INTEGRATION_TIMEOUT_SECONDS: ${INTEGRATION_TIMEOUT_SECONDS:-10}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Copy .env.example to .env or run python scripts/bootstrap.py}
      CONNECT_SECRET_TOKEN: ${CONNECT_SECRET_TOKEN:?Copy .env.example to .env or run python scripts/bootstrap.py}
      DATABASE_URL: postgresql+asyncpg://cluecdc:${METADATA_PASSWORD}@metadata-db:5432/cluecdc
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
    ports:
      - "127.0.0.1:${CLUECDC_API_PORT:-8000}:8000"
    depends_on:
      metadata-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 30

  cluecdc-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      args:
        INSTALL_DEV: "false"
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AUTH_MODE: ${AUTH_MODE:-developer}
      AUTH_TOKENS_JSON: ${AUTH_TOKENS_JSON:-{}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?Copy .env.example to .env or run python scripts/bootstrap.py}
      CONNECT_SECRET_TOKEN: ${CONNECT_SECRET_TOKEN:?Copy .env.example to .env or run python scripts/bootstrap.py}
      DATABASE_URL: postgresql+asyncpg://cluecdc:${METADATA_PASSWORD}@metadata-db:5432/cluecdc
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      RECONCILE_INTERVAL_SECONDS: ${RECONCILE_INTERVAL_SECONDS:-10}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-300}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      INTEGRATION_TIMEOUT_SECONDS: ${INTEGRATION_TIMEOUT_SECONDS:-10}
    depends_on:
      cluecdc-api:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy

  kafka-connect:
    build:
      context: .
      dockerfile: infrastructure/docker/connect.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: cluecdc-connect
      CONFIG_STORAGE_TOPIC: _cluecdc_connect_configs
      OFFSET_STORAGE_TOPIC: _cluecdc_connect_offsets
      STATUS_STORAGE_TOPIC: _cluecdc_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_CONFIG_PROVIDERS: cluecdc
      CONNECT_CONFIG_PROVIDERS_CLUECDC_CLASS: io.cluecdc.connect.ClueSecretConfigProvider
      CONNECT_CONFIG_PROVIDERS_CLUECDC_PARAM_URL: http://cluecdc-api:8000
      CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY: All
      CLUECDC_SECRETS_TOKEN: ${CONNECT_SECRET_TOKEN:?Copy .env.example to .env or run python scripts/bootstrap.py}
    depends_on:
      kafka:
        condition: service_healthy
      cluecdc-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connector-plugins >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  cluecdc-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://cluecdc-api:8000
    ports:
      - "127.0.0.1:${CLUECDC_WEB_PORT:-3000}:3000"
    depends_on:
      cluecdc-api:
        condition: service_healthy

volumes:
  metadata:
  kafka:
