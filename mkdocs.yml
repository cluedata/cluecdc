site_name: ClueCDC
site_description: Open-source control plane for Change Data Capture with Debezium, Apache Kafka, and Kafka Connect.
site_author: ClueData
site_url: https://cluedata.github.io/cluecdc/
repo_name: cluedata/cluecdc
repo_url: https://github.com/cluedata/cluecdc
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 ClueCDC contributors

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo-mark.svg
  favicon: assets/logo-mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cluedata/cluecdc
      name: ClueCDC on GitHub
  generator: false

nav:
  - Home: index.md
  - Getting Started:
      - Introduction: getting-started/introduction.md
      - Prerequisites: getting-started/prerequisites.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - First CDC Pipeline: getting-started/first-pipeline.md
  - Concepts:
      - Architecture: architecture/overview.md
      - Control Plane: architecture/control-plane.md
      - Data Plane: architecture/data-plane.md
      - Change Data Capture: concepts/change-data-capture.md
      - Debezium: concepts/debezium.md
      - Apache Kafka: concepts/kafka.md
      - Kafka Connect: concepts/kafka-connect.md
      - Sources and Destinations: concepts/sources-destinations.md
      - Pipeline Lifecycle: architecture/pipeline-lifecycle.md
      - Snapshots and Offsets: concepts/snapshots-offsets.md
      - Schema Evolution: concepts/schema-evolution.md
  - Connections:
      - Overview: connections/index.md
      - PostgreSQL Source: connectors/postgresql.md
      - PostgreSQL Destination: connectors/postgresql-destination.md
      - MySQL: connectors/mysql.md
      - AWS S3 and MinIO: connectors/object-storage.md
      - Kafka: connections/kafka.md
      - Kafka Connect: connections/kafka-connect.md
  - Pipelines:
      - Creating a Pipeline: pipelines/creating.md
      - Adding Tables: pipelines/adding-tables.md
      - Removing Tables: pipelines/removing-tables.md
      - Configuration: pipelines/configuration.md
      - Pause and Resume: pipelines/pause-resume.md
      - Snapshots and Resnapshots: pipelines/snapshots.md
      - Error Recovery: pipelines/error-recovery.md
  - Operations:
      - User Management: operations/user-management.md
      - Monitoring: operations/monitoring.md
      - Alerts: alerting.md
      - Kafka Topics: operations/kafka-topics.md
      - Connector Management: operations/connector-management.md
      - Error Handling: operations/error-handling.md
      - Troubleshooting and Recovery: operations/troubleshooting.md
      - API Reference: api/overview.md
  - Deployment:
      - Docker Compose: getting-started/docker-compose.md
      - Kubernetes: deployment/kubernetes.md
      - Configuration: operations/configuration.md
      - Scaling: deployment/scaling.md
      - Production Considerations: deployment/production.md
      - Security: deployment/security.md
  - Security:
      - Authentication: security/authentication.md
      - Roles and Permissions: security/roles.md
  - Development:
      - Architecture: development/architecture.md
      - Local Development: development/setup.md
      - Backend and Frontend: development/backend-frontend.md
      - Signal Console UI: signal-console.md
      - Testing: development/testing.md
      - Metadata Migrations: development/migrations.md
