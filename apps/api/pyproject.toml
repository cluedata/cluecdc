[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "cluecdc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.42.0", "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.48", "alembic==1.18.4", "asyncpg==0.31.0",
  "aiomysql==0.3.2",
  "httpx==0.28.1", "cryptography==50.0.1", "aiokafka==0.13.0",
  "confluent-kafka==2.15.1",
  "structlog==25.5.0", "prometheus-client==0.24.1",
  "boto3==1.40.35",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "ruff==0.15.6", "mypy==1.19.1", "respx==0.22.0", "aiosqlite==0.22.1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
check_untyped_defs = true
exclude = ["migrations"]
