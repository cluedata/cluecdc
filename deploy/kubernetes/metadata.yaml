apiVersion: v1
kind: Service
metadata:
  name: cluecdc-metadata
spec:
  selector:
    app.kubernetes.io/name: cluecdc-metadata
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cluecdc-metadata
spec:
  serviceName: cluecdc-metadata
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluecdc-metadata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluecdc-metadata
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17.9
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: cluecdc
            - name: POSTGRES_USER
              value: cluecdc
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluecdc-secrets
                  key: metadata-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cluecdc", "-d", "cluecdc"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cluecdc", "-d", "cluecdc"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
