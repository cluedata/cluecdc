apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cluecdc
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [cluecdc.example.com]
      secretName: cluecdc-tls
  rules:
    - host: cluecdc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cluecdc-web
                port:
                  name: http
