apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluecdc-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - { protocol: TCP, port: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-clients
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluecdc-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cluecdc-web
        - podSelector:
            matchLabels:
              cluecdc.io/connect-client: "true"
        - namespaceSelector:
            matchLabels:
              cluecdc.io/connect-client: "true"
          podSelector:
            matchLabels:
              cluecdc.io/connect-client: "true"
        - namespaceSelector:
            matchLabels:
              cluecdc.io/monitoring: "true"
      ports:
        - { protocol: TCP, port: 8000 }
