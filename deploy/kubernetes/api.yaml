apiVersion: v1
kind: Service
metadata:
  name: cluecdc-api
spec:
  selector:
    app.kubernetes.io/name: cluecdc-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluecdc-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluecdc-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluecdc-api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/cluedata/cluecdc-api:0.2.1
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef: { name: cluecdc-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: database-url } }
            - name: SECRET_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: secret-encryption-key } }
            - name: CONNECT_SECRET_TOKEN
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: connect-secret-token } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: session-secret } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      containers:
        - name: api
          image: ghcr.io/cluedata/cluecdc-api:0.2.1
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "25"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: { name: cluecdc-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: database-url } }
            - name: SECRET_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: secret-encryption-key } }
            - name: CONNECT_SECRET_TOKEN
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: connect-secret-token } }
            - name: SESSION_SECRET
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: session-secret } }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
