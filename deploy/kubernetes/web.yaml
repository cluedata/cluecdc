apiVersion: v1
kind: Service
metadata:
  name: cluecdc-web
spec:
  selector:
    app.kubernetes.io/name: cluecdc-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluecdc-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluecdc-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluecdc-web
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: ghcr.io/cluedata/cluecdc-web:0.1.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_INTERNAL_URL
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: API_INTERNAL_URL } }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
