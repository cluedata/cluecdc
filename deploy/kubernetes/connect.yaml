# Development reference only. This workload is intentionally excluded from the
# production Kustomize base; operate Kafka Connect as an external dependency.
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
spec:
  selector:
    app.kubernetes.io/name: kafka-connect
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-connect
    spec:
      automountServiceAccountToken: false
      containers:
        - name: connect
          image: ghcr.io/cluedata/cluecdc-connect:0.2.1
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_BOOTSTRAP_SERVERS } }
            - name: CONNECT_SECURITY_PROTOCOL
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_SECURITY_PROTOCOL } }
            - name: CONNECT_SASL_MECHANISM
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_SASL_MECHANISM } }
            - name: CONNECT_SASL_JAAS_CONFIG
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: kafka-sasl-jaas-config } }
            - { name: CONNECT_SSL_TRUSTSTORE_TYPE, value: PEM }
            - { name: CONNECT_SSL_TRUSTSTORE_CERTIFICATES, value: '${file:/etc/cluecdc-kafka/ca.properties:ca}' }
            - name: CONNECT_PRODUCER_SECURITY_PROTOCOL
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_SECURITY_PROTOCOL } }
            - name: CONNECT_PRODUCER_SASL_MECHANISM
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_SASL_MECHANISM } }
            - name: CONNECT_PRODUCER_SASL_JAAS_CONFIG
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: kafka-sasl-jaas-config } }
            - { name: CONNECT_PRODUCER_SSL_TRUSTSTORE_TYPE, value: PEM }
            - { name: CONNECT_PRODUCER_SSL_TRUSTSTORE_CERTIFICATES, value: '${file:/etc/cluecdc-kafka/ca.properties:ca}' }
            - name: CONNECT_CONSUMER_SECURITY_PROTOCOL
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_SECURITY_PROTOCOL } }
            - name: CONNECT_CONSUMER_SASL_MECHANISM
              valueFrom: { configMapKeyRef: { name: cluecdc-config, key: KAFKA_SASL_MECHANISM } }
            - name: CONNECT_CONSUMER_SASL_JAAS_CONFIG
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: kafka-sasl-jaas-config } }
            - { name: CONNECT_CONSUMER_SSL_TRUSTSTORE_TYPE, value: PEM }
            - { name: CONNECT_CONSUMER_SSL_TRUSTSTORE_CERTIFICATES, value: '${file:/etc/cluecdc-kafka/ca.properties:ca}' }
            - { name: GROUP_ID, value: cluecdc-connect }
            - { name: CONFIG_STORAGE_TOPIC, value: _cluecdc_connect_configs }
            - { name: OFFSET_STORAGE_TOPIC, value: _cluecdc_connect_offsets }
            - { name: STATUS_STORAGE_TOPIC, value: _cluecdc_connect_status }
            - { name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR, value: "3" }
            - { name: KEY_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter }
            - { name: VALUE_CONVERTER, value: org.apache.kafka.connect.json.JsonConverter }
            - { name: KEY_CONVERTER_SCHEMAS_ENABLE, value: "false" }
            - { name: VALUE_CONVERTER_SCHEMAS_ENABLE, value: "false" }
            - { name: CONNECT_CONFIG_PROVIDERS, value: 'cluecdc,file' }
            - { name: CONNECT_CONFIG_PROVIDERS_FILE_CLASS, value: org.apache.kafka.common.config.provider.FileConfigProvider }
            - { name: CONNECT_CONFIG_PROVIDERS_CLUECDC_CLASS, value: io.cluecdc.connect.ClueSecretConfigProvider }
            - { name: CONNECT_CONFIG_PROVIDERS_CLUECDC_PARAM_URL, value: http://cluecdc-api:8000 }
            - { name: CONNECT_CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY, value: All }
            - name: CLUECDC_SECRETS_TOKEN
              valueFrom: { secretKeyRef: { name: cluecdc-secrets, key: connect-secret-token } }
          readinessProbe:
            httpGet: { path: /connector-plugins, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
          volumeMounts:
            - { name: kafka-ca, mountPath: /etc/cluecdc-kafka, readOnly: true }
      volumes:
        - name: kafka-ca
          secret:
            secretName: cluecdc-secrets
            items:
              - { key: kafka-ca-properties, path: ca.properties }
