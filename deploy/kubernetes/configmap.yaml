apiVersion: v1
kind: ConfigMap
metadata:
  name: cluecdc-config
data:
  ENVIRONMENT: production
  AUTH_MODE: session
  SESSION_TTL_SECONDS: "28800"
  INVITE_TTL_SECONDS: "86400"
  PUBLIC_URL: https://cluecdc.example.com
  LOG_LEVEL: info
  CORS_ORIGINS: '["https://cluecdc.example.com"]'
  API_INTERNAL_URL: http://cluecdc-api:8000
  WORKER_CONCURRENCY: "4"
  RECONCILE_INTERVAL_SECONDS: "10"
  JOB_LEASE_SECONDS: "300"
  JOB_MAX_ATTEMPTS: "3"
  JOB_RETRY_BASE_SECONDS: "2"
  JOB_RETRY_MAX_SECONDS: "60"
  JOB_RETRY_JITTER_RATIO: "0.2"
  CONNECTOR_OPERATION_LEASE_SECONDS: "300"
