apiVersion: v1
kind: ConfigMap
metadata:
  name: cluecdc-config
data:
  ENVIRONMENT: production
  AUTH_MODE: session
  SESSION_TTL_SECONDS: "28800"
  INVITE_TTL_SECONDS: "86400"
  PUBLIC_URL: https://cluecdc.example.com
  LOG_LEVEL: info
  CORS_ORIGINS: '["https://cluecdc.example.com"]'
  API_INTERNAL_URL: http://cluecdc-api:8000
  KAFKA_BOOTSTRAP_SERVERS: kafka.example.internal:9092
