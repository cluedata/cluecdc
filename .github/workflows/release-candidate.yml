name: Release candidate
run-name: Release candidate validation — ${{ github.ref_name }}

on:
  workflow_dispatch:

# Candidate runs cannot push packages, change repository contents or create tags.
permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/release-validation.yml
