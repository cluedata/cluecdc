name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run_full_ci:
        description: "Run every CI gate, including CDC/S3/browser integration"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'scheduled-audit' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.gates.outputs.web }}
      api: ${{ steps.gates.outputs.api }}
      docs: ${{ steps.gates.outputs.docs }}
      compose: ${{ steps.gates.outputs.compose }}
      deployment: ${{ steps.gates.outputs.deployment }}
      audit_web: ${{ steps.gates.outputs.audit_web }}
      audit_api: ${{ steps.gates.outputs.audit_api }}
      containers: ${{ steps.gates.outputs.containers }}
      container_matrix: ${{ steps.gates.outputs.container_matrix }}
      integration: ${{ steps.gates.outputs.integration }}
      cdc: ${{ steps.gates.outputs.cdc }}
      s3: ${{ steps.gates.outputs.s3 }}
      browser: ${{ steps.gates.outputs.browser }}
      browser_integration: ${{ steps.gates.outputs.browser_integration }}
      workload: ${{ steps.gates.outputs.workload }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select gates from changed files
        id: gates
        env:
          RUN_FULL_CI: ${{ inputs.run_full_ci || false }}
        run: python scripts/ci_changes.py

  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python scripts/check-repository.py
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --verbose --config=/github/workspace/.gitleaks.toml /github/workspace

  compose-config:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.24.7
      - name: Render supported Compose configurations without a daemon
        shell: python
        run: |
          import shutil
          import subprocess
          cli = ["docker", "compose"] if shutil.which("docker") else ["compose"]
          base = [*cli, "--env-file", ".env.example"]
          configurations = [
              [],
              ["-f", "compose.yaml", "-f", ".github/compose.ci.yaml"],
              ["--env-file", ".env.test.example", "-f", "compose.yaml",
               "-f", "compose.test.yaml", "--profile", "tools"],
              ["--env-file", ".env.test.example", "-f", "compose.yaml",
               "-f", "compose.test.yaml", "-f", ".github/compose.ci.yaml",
               "-f", ".github/compose.test.ci.yaml", "--profile", "tools"],
              ["--env-file", ".env.test.example", "-f", "compose.yaml",
               "-f", "compose.test.yaml", "-f", ".github/compose.ci.yaml",
               "-f", ".github/compose.test.ci.yaml", "--profile", "object-storage"],
          ]
          for configuration in configurations:
              subprocess.run([*base, *configuration, "config", "--quiet"], check=True)

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:web
      # The production build is verified once, inside the web image below.

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WORKER_TEST_DATABASE_URL: postgresql+asyncpg://worker_test:worker-test-only@localhost:5432/worker_test
    services:
      worker-test-postgres:
        image: postgres:17.9
        env:
          POSTGRES_DB: worker_test
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev]"
      - run: python -m ruff check apps/api scripts
      - run: python -m ruff format --check apps/api scripts
      - run: python -m mypy --config-file apps/api/pyproject.toml apps/api/app
      - run: python -m pytest apps/api/tests -q

  documentation:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  deployment:
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/deployment_validation.py
      - name: Validate production Kubernetes schemas
        run: kubectl kustomize deploy/kubernetes | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c -strict -summary -

  audit-web:
    needs: changes
    if: needs.changes.outputs.audit_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # npm can audit the lockfile without installing node_modules again.
      - run: npm audit --package-lock-only --omit=dev --audit-level=high
      - run: npm audit --package-lock-only --audit-level=critical

  audit-api:
    needs: changes
    if: needs.changes.outputs.audit_api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e "apps/api[dev]" pip-audit==2.10.1
      - run: python -m pip_audit --local --skip-editable

  containers-and-smoke:
    name: Native ${{ matrix.arch }} build and smoke
    needs: changes
    if: needs.changes.outputs.containers == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.container_matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Prepare the core-only CI environment
        run: |
          cp .env.example .env
          python scripts/bootstrap.py
      - uses: docker/setup-buildx-action@v4
      - name: Reuse the final native Connect image
        id: connect-image
        uses: ./.github/actions/cached-ci-image
        with:
          name: connect
          image: cluecdc-ci-connect:ci
          dockerfile: infrastructure/docker/connect.Dockerfile
          cache-key: connect-${{ hashFiles('infrastructure/docker/connect.Dockerfile', 'infrastructure/connect/**', '.dockerignore') }}
          defer-build: "true"
      - name: Build runtime images once with persistent per-architecture caches
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yaml
            compose.test.yaml
            .github/compose.ci.yaml
            .github/compose.test.ci.yaml
          targets: ${{ steps.connect-image.outputs.cache-hit == 'true' && 'cluecdc-api,cluecdc-web' || 'cluecdc-api,cluecdc-web,kafka-connect' }}
          load: true
          set: |
            cluecdc-api.cache-from=type=gha,scope=ci-api-${{ matrix.arch }}
            cluecdc-api.cache-to=type=gha,scope=ci-api-${{ matrix.arch }},mode=max,timeout=60s,ignore-error=true
            cluecdc-web.cache-from=type=gha,scope=ci-web-${{ matrix.arch }}
            cluecdc-web.cache-to=type=gha,scope=ci-web-${{ matrix.arch }},mode=max,timeout=60s,ignore-error=true
      - name: Save the native Connect fixture after a cache-miss parallel build
        if: steps.connect-image.outputs.cache-hit != 'true'
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/cluecdc-ci-images/connect.tar
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          actual=$(docker image inspect --format '{{.Architecture}}' cluecdc-ci-connect:ci)
          test "$actual" = "$EXPECTED_ARCH"
          mkdir -p "$(dirname "$IMAGE_ARCHIVE")"
          docker image save --output "$IMAGE_ARCHIVE" cluecdc-ci-connect:ci
      - name: Start the six core services without rebuilding
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Verify packaged pages and native image optimization
        shell: python
        run: |
          import urllib.request
          for path in ("/login", "/brand/cluecdc-logo.png", "/brand/cluecdc-icon.png",
                       "/_next/image?url=%2Fbrand%2Fcluecdc-logo.png&w=64&q=75"):
              with urllib.request.urlopen("http://127.0.0.1:3000" + path, timeout=30) as response:
                  assert response.status == 200 and response.read(1), path
      - run: docker compose exec -T cluecdc-api alembic check
      - name: Reuse the final S3 fixture image only when needed
        if: matrix.arch == 'amd64' && (needs.changes.outputs.s3 == 'true' || needs.changes.outputs.browser_integration == 'true')
        uses: ./.github/actions/cached-ci-image
        with:
          name: minio
          image: cluecdc-ci-minio:ci
          dockerfile: infrastructure/docker/minio-test.Dockerfile
          cache-key: minio-${{ hashFiles('infrastructure/docker/minio-test.Dockerfile', '.dockerignore') }}
      # CDC/S3/browser coverage is retained once on native AMD64, only for relevant changes.
      - name: Add integration fixtures to the running core stack
        if: matrix.arch == 'amd64' && needs.changes.outputs.integration == 'true'
        run: |
          cat .env.test.example >> .env
          export COMPOSE_FILE=compose.yaml:compose.test.yaml:.github/compose.ci.yaml:.github/compose.test.ci.yaml
          echo "COMPOSE_FILE=$COMPOSE_FILE" >> "$GITHUB_ENV"
          if [[ "$S3_CHECKS" == "true" || "$BROWSER_INTEGRATION_CHECKS" == "true" ]]; then
            export COMPOSE_PROFILES=object-storage
            echo "COMPOSE_PROFILES=$COMPOSE_PROFILES" >> "$GITHUB_ENV"
          fi
          if [[ "$CDC_CHECKS" != "true" && "$S3_CHECKS" != "true" && "$BROWSER_INTEGRATION_CHECKS" != "true" ]]; then
            docker compose up -d --no-build --wait --wait-timeout 300 postgres-demo mysql-demo
          elif [[ "$CDC_CHECKS" != "true" && "$BROWSER_INTEGRATION_CHECKS" != "true" ]]; then
            fixtures=(cluecdc-api cluecdc-worker postgres-demo minio minio-bootstrap)
            if [[ "$WORKLOAD_CHECKS" == "true" ]]; then
              fixtures+=(mysql-demo)
            fi
            docker compose up -d --no-build --wait --wait-timeout 300 "${fixtures[@]}"
          else
            docker compose up -d --no-build --wait --wait-timeout 300
          fi
        env:
          CDC_CHECKS: ${{ needs.changes.outputs.cdc }}
          S3_CHECKS: ${{ needs.changes.outputs.s3 }}
          BROWSER_INTEGRATION_CHECKS: ${{ needs.changes.outputs.browser_integration }}
          WORKLOAD_CHECKS: ${{ needs.changes.outputs.workload }}
      - uses: actions/setup-node@v7
        if: matrix.arch == 'amd64' && needs.changes.outputs.browser == 'true'
        with:
          node-version: "24"
          cache: npm
      - name: Install only the host dependencies used by acceptance scripts
        if: matrix.arch == 'amd64' && (needs.changes.outputs.cdc == 'true' || needs.changes.outputs.s3 == 'true' || needs.changes.outputs.browser_integration == 'true')
        shell: python
        run: |
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          dependencies = tomllib.loads(Path("apps/api/pyproject.toml").read_text())["project"]["dependencies"]
          required = [item for item in dependencies if item.startswith(("boto3==", "confluent-kafka=="))]
          assert len(required) == 2, "Update the acceptance dependency selector"
          subprocess.run([sys.executable, "-m", "pip", "install", *required], check=True)
      - name: Install browser tooling without the unused headless-shell download
        if: matrix.arch == 'amd64' && needs.changes.outputs.browser == 'true'
        run: |
          npm ci
          npm exec -w @cluecdc/web -- playwright install --with-deps --no-shell chromium
      - name: Seed and verify live capture for CDC or integration browser tests
        if: matrix.arch == 'amd64' && (needs.changes.outputs.cdc == 'true' || needs.changes.outputs.browser_integration == 'true')
        run: python scripts/demo.py --api-url http://localhost:3000/api/v1
      - name: Verify JDBC destination delivery
        if: matrix.arch == 'amd64' && needs.changes.outputs.cdc == 'true'
        run: python scripts/demo-destination.py --skip-capture-demo
      - name: Verify real S3 object contents
        if: matrix.arch == 'amd64' && needs.changes.outputs.s3 == 'true'
        run: python scripts/demo-object-storage.py
      - name: Verify browser flows
        if: matrix.arch == 'amd64' && needs.changes.outputs.browser == 'true'
        env:
          BROWSER_INTEGRATION_CHECKS: ${{ needs.changes.outputs.browser_integration }}
        run: |
          if [[ "$BROWSER_INTEGRATION_CHECKS" == "true" ]]; then
            npm run test:e2e -w @cluecdc/web
          else
            npm run test:e2e -w @cluecdc/web -- shell.spec.ts
          fi
      - name: Verify secret boundaries
        if: matrix.arch == 'amd64' && (needs.changes.outputs.cdc == 'true' || needs.changes.outputs.s3 == 'true' || needs.changes.outputs.browser_integration == 'true')
        run: python scripts/verify-secrets.py
      - name: Build the optional workload tool only when it changes
        if: needs.changes.outputs.workload == 'true'
        uses: docker/bake-action@v7
        with:
          files: |
            compose.yaml
            compose.test.yaml
            .github/compose.ci.yaml
            .github/compose.test.ci.yaml
          targets: commerce-generator
          load: true
          set: |
            commerce-generator.cache-from=type=gha,scope=ci-workload-${{ matrix.arch }}
            commerce-generator.cache-to=type=gha,scope=ci-workload-${{ matrix.arch }},mode=max,ignore-error=true
      - name: Verify ARM64 workload native dependencies without database fixtures
        if: matrix.arch == 'arm64' && needs.changes.outputs.workload == 'true'
        run: docker run --rm cluecdc-ci-workload:ci python -c "import psycopg, pymysql, cryptography"
      - name: Test the workload tool
        if: matrix.arch == 'amd64' && needs.changes.outputs.workload == 'true'
        run: docker compose run --rm --no-deps commerce-generator python -m unittest -v
      - name: Capture failure diagnostics
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          result = subprocess.run(
              ["docker", "compose", "logs", "--no-color", "--tail", "100"],
              capture_output=True, text=True, timeout=60, check=False,
          )
          logs = result.stdout + result.stderr
          if Path(".env").exists():
              for line in Path(".env").read_text().splitlines():
                  key, separator, value = line.partition("=")
                  if separator and value and not key.startswith("#") and any(
                      word in key for word in ("PASSWORD", "SECRET", "TOKEN", "ACCESS_KEY")
                  ):
                      logs = logs.replace(value, "[REDACTED]")
          Path("compose.log").write_text(logs, encoding="utf-8")
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verification-${{ matrix.arch }}
          path: |
            compose.log
            artifacts/
            apps/web/test-results/
          if-no-files-found: ignore
      - name: Remove disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  checks:
    name: CI checks
    if: always()
    needs: [changes, repository, compose-config, web, api, documentation, deployment, audit-web, audit-api, containers-and-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected gate to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: python
        run: |
          import json
          import os
          results = json.loads(os.environ["JOB_RESULTS"])
          failures = {job: data["result"] for job, data in results.items()
                      if data["result"] not in ("success", "skipped")}
          if failures:
              raise SystemExit(str(failures))
          print("Every selected CI gate passed; unrelated gates were skipped.")
