name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WORKER_TEST_DATABASE_URL: postgresql+asyncpg://worker_test:worker-test-only@localhost:5432/worker_test
      DQ_LIVE_TESTS: "0"
    services:
      worker-test-postgres:
        image: postgres:17.9
        env:
          POSTGRES_DB: worker_test
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install -e "apps/api[dev]"
      - name: Check repository safety
        run: python scripts/check-repository.py
      - name: Test backend APIs, permissions and worker contracts
        run: python -m pytest apps/api/tests -q --junitxml=artifacts/api-tests.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-tests
          path: artifacts/api-tests.xml
          if-no-files-found: ignore
