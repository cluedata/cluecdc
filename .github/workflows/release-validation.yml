name: Release validation

on:
  workflow_call:
    inputs:
      tag:
        description: "Expected tag; empty for an untagged candidate"
        type: string
        default: ""
      require-final:
        description: "Reject draft release metadata before publication"
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.quality.outputs.version }}
      git-sha:
        value: ${{ jobs.quality.outputs.git-sha }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      git-sha: ${{ steps.metadata.outputs.git-sha }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WORKER_TEST_DATABASE_URL: postgresql+asyncpg://worker_test:worker-test-only@localhost:5432/worker_test
    services:
      worker-test-postgres:
        image: postgres:17.9
        env:
          POSTGRES_DB: worker_test
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            requirements-docs.txt
      - name: Check version, notes, changelog and deployment images
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: python scripts/check-release-version.py --tag "$EXPECTED_TAG"
      - name: Require finalized publication metadata
        if: inputs.require-final
        run: python scripts/check-release-version.py --require-final
      - name: Record the exact candidate without tagging or publishing
        id: metadata
        run: |
          mkdir -p artifacts
          python scripts/release.py plan --json > artifacts/release-metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('artifacts/release-metadata.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={metadata['version']}\n")
              output.write(f"git-sha={metadata['git_sha']}\n")
          PY
          python scripts/release.py plan >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e "apps/api[dev]" -r requirements-docs.txt pip-audit==2.10.1
      - name: Run the shared local and CI quality gate
        run: python scripts/release-check.py --preparation --quality-only
      - name: Validate production Kubernetes schemas
        run: kubectl kustomize deploy/kubernetes | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c -strict -summary -
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact --verbose --config=/github/workspace/.gitleaks.toml /github/workspace
      - name: Build source artifact and checksums for this SHA
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="cluecdc-${VERSION}/" --output="dist/cluecdc-${VERSION}.tar.gz" HEAD
          cp artifacts/release-metadata.json dist/release-metadata.json
          cd dist
          sha256sum -- ./cluecdc-*.tar.gz ./release-metadata.json > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-validation-metadata
          path: artifacts/release-metadata.json
          if-no-files-found: ignore
