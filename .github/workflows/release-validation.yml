name: Release validation

on:
  workflow_call:
    inputs:
      tag:
        description: "Expected tag; empty for an untagged candidate"
        type: string
        default: ""
      require-final:
        description: "Reject draft release metadata before publication"
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.quality.outputs.version }}
      git-sha:
        value: ${{ jobs.quality.outputs.git-sha }}
      acceptance:
        value: ${{ jobs.quality.outputs.acceptance }}

# Inherit caller permissions: candidate is contents:read only; the publisher also
# grants packages:read for authenticated, read-only registry preflight.

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WORKER_TEST_DATABASE_URL: postgresql+asyncpg://worker_test:worker-test-only@localhost:5432/worker_test
      DQ_LIVE_TESTS: "0"
    services:
      worker-test-postgres:
        image: postgres:17.9
        env:
          POSTGRES_DB: worker_test
          POSTGRES_USER: worker_test
          POSTGRES_PASSWORD: worker-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U worker_test -d worker_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      git-sha: ${{ steps.metadata.outputs.git-sha }}
      acceptance: ${{ steps.metadata.outputs.acceptance }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Validate metadata and acceptance before installing test dependencies
        id: metadata
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          REQUIRE_FINAL: ${{ inputs.require-final }}
        run: |
          mkdir -p artifacts
          args=(plan --tag "$EXPECTED_TAG" --json)
          if [[ "$REQUIRE_FINAL" == "true" ]]; then args+=(--require-final); fi
          python scripts/release.py "${args[@]}" > artifacts/release-metadata.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('artifacts/release-metadata.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={metadata['version']}\n")
              output.write(f"git-sha={metadata['git_sha']}\n")
              output.write(f"acceptance={metadata['acceptance']['status']}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Candidate {metadata['tag']}\nCommit: {metadata['git_sha']}\n\n")
              summary.write(f"Metadata final: {metadata['metadata_final']}\n\n")
              summary.write(f"Acceptance: {metadata['acceptance']['status']}\n\n")
              for message in metadata['warnings'] + metadata['acceptance']['blockers']:
                  summary.write(f"- {message}\n")
              summary.write("\nThis check does not grant maintainer publication approval.\n")
          PY
      - name: Publication preflight before tests or builds
        if: inputs.require-final
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"
          python scripts/check_release_publication.py --tag "$EXPECTED_TAG"
      - name: Check repository safety
        run: python scripts/check-repository.py
      - name: Install API test dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Test backend APIs, migrations and native PostgreSQL worker contracts
        run: python -m pytest apps/api/tests -q --junitxml=artifacts/api-tests.xml
      - name: Build source artifact and checksums for this SHA
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="cluecdc-${VERSION}/" --output="dist/cluecdc-${VERSION}.tar.gz" HEAD
          cp artifacts/release-metadata.json dist/release-metadata.json
          cd dist
          sha256sum -- ./cluecdc-*.tar.gz ./release-metadata.json > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-tests
          path: artifacts/api-tests.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: release-validation-metadata
          path: artifacts/release-metadata.json
          if-no-files-found: ignore
