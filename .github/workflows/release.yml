name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/release-validation.yml
    with:
      tag: ${{ github.ref_name }}
      require-final: true

  publication-preflight:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/${DEFAULT_BRANCH}"
      - name: Refuse existing releases and immutable image versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/check_release_publication.py --tag "$GITHUB_REF_NAME"

  hardening:
    needs: [validate, publication-preflight]
    uses: ./.github/workflows/hardening.yml

  containers:
    needs: [validate, publication-preflight, hardening]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            image: cluecdc-web
            dockerfile: Dockerfile
          - component: api
            image: cluecdc-api
            dockerfile: infrastructure/docker/api.Dockerfile
          - component: connect
            image: cluecdc-connect
            dockerfile: infrastructure/docker/connect.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Failed-job reruns may reuse an earlier successful global preflight.
      # Recheck this component on every attempt, including partial publications.
      - name: Recheck immutable image availability for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: python scripts/check_release_publication.py --tag "$GITHUB_REF_NAME" --component "$COMPONENT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=ClueCDC ${{ matrix.component }}
            org.opencontainers.image.description=ClueCDC CDC control-plane ${{ matrix.component }} image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  github-release:
    needs: [validate, publication-preflight, hardening, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: Verify downloaded source evidence belongs to the tagged commit
        run: |
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('dist/release-metadata.json').read_text())
          if metadata['git_sha'] != os.environ['GITHUB_SHA'] or metadata['tag'] != os.environ['GITHUB_REF_NAME'] or metadata['dirty']:
              raise SystemExit('Release artifact does not match the clean tagged commit')
          PY
      - name: Create GitHub release without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag "${prerelease[@]}" \
            --title "ClueCDC ${GITHUB_REF_NAME}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
