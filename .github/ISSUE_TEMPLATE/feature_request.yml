name: Feature request
description: Propose a focused Community Edition improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      {
        label: Problem,
        description: What operational problem should ClueCDC solve?,
      }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: compatibility
    attributes:
      {
        label: Compatibility and operational impact,
        description: Note API,
        migration,
        security,
        connector,
        or deployment impact.,
      }
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal does not require a hidden ClueCDC-hosted dependency.
          required: true
        - label: I have not presented planned behavior as already implemented.
          required: true
