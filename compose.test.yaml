services:
  cdc-source-postgres:
    image: postgres:17.9
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SOURCE_ADMIN_PASSWORD:-cluecdc-source-admin-test-only}
      SOURCE_PASSWORD: ${SOURCE_PASSWORD:-cluecdc-source-test-only}
    ports:
      - "127.0.0.1:${POSTGRES_SOURCE_PORT:-5434}:5432"
    volumes:
      - source-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 20

  cdc-source-mysql:
    image: mysql:8.4
    command: ["--server-id=223344", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-expire-logs-seconds=604800", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_SOURCE_ADMIN_PASSWORD:-cluecdc-mysql-source-admin-test-only}
      MYSQL_DATABASE: shop
      MYSQL_CDC_PASSWORD: ${MYSQL_SOURCE_PASSWORD:-cluecdc-mysql-source-test-only}
    ports:
      - "127.0.0.1:${MYSQL_SOURCE_PORT:-3307}:3306"
    volumes:
      - source-mysql:/var/lib/mysql
      - ./infrastructure/mysql/source-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  destination-postgres:
    image: postgres:17.9
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DESTINATION_ADMIN_PASSWORD:-cluecdc-destination-admin-test-only}
      DESTINATION_PASSWORD: ${DESTINATION_PASSWORD:-cluecdc-destination-test-only}
    ports:
      - "127.0.0.1:${POSTGRES_DESTINATION_PORT:-5435}:5432"
    volumes:
      - destination-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/destination-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 20

  destination-mysql:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DESTINATION_ADMIN_PASSWORD:-cluecdc-mysql-destination-admin-test-only}
      MYSQL_DATABASE: analytics_mysql
      MYSQL_DELIVERY_PASSWORD: ${MYSQL_DESTINATION_PASSWORD:-cluecdc-mysql-destination-test-only}
    ports:
      - "127.0.0.1:${MYSQL_DESTINATION_PORT:-3308}:3306"
    volumes:
      - destination-mysql:/var/lib/mysql
      - ./infrastructure/mysql/destination-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  commerce-generator:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/docker/commerce-generator.Dockerfile
    environment:
      PGHOST: cdc-source-postgres
      PGPORT: 5432
      PGDATABASE: commerce
      PGUSER: cdc_user
      PGPASSWORD: ${SOURCE_PASSWORD:-cluecdc-source-test-only}
      PGSCHEMA: public
      MYSQL_HOST: cdc-source-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: shop
      MYSQL_USER: cdc_mysql
      MYSQL_PASSWORD: ${MYSQL_SOURCE_PASSWORD:-cluecdc-mysql-source-test-only}
    depends_on:
      cdc-source-postgres:
        condition: service_healthy
      cdc-source-mysql:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  source-postgres:
  source-mysql:
  destination-postgres:
  destination-mysql:
