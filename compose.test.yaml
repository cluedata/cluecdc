# Local test fixtures only. Public credentials are not for shared deployments.
# Inline configs keep initialization portable: no host bind mounts or shell tooling.
services:
  cluecdc-api:
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully

  # Source and destination fixtures share one PostgreSQL server while keeping
  # separate logical databases to prevent sink writes from re-entering CDC.
  postgres-demo:
    image: postgres:17.9
    command:
      [
        "postgres",
        "-c",
        "wal_level=logical",
        "-c",
        "max_replication_slots=10",
        "-c",
        "max_wal_senders=10",
      ]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_DEMO_ADMIN_PASSWORD:-postgres123}
      POSTGRES_DEMO_SOURCE_PASSWORD: ${POSTGRES_DEMO_SOURCE_PASSWORD:-source123}
      POSTGRES_DEMO_DESTINATION_PASSWORD: ${POSTGRES_DEMO_DESTINATION_PASSWORD:-destination123}
    ports:
      - "127.0.0.1:${POSTGRES_DEMO_PORT:-5434}:5432"
    volumes:
      - postgres-demo:/var/lib/postgresql/data
    configs:
      - source: postgres-demo-init
        target: /docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$$POSTGRES_DEMO_SOURCE_PASSWORD" psql -h 127.0.0.1 -U source_user -d cluecdc_source -Atqc 'SELECT 1 FROM public.customers LIMIT 1' >/dev/null && PGPASSWORD="$$POSTGRES_DEMO_DESTINATION_PASSWORD" psql -h 127.0.0.1 -U destination_user -d cluecdc_destination -Atqc 'SELECT 1 FROM public.customers LIMIT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20

  # MySQL follows the same shared-server/separate-database fixture model.
  mysql-demo:
    image: mysql:8.4
    command:
      [
        "--server-id=223344",
        "--log-bin=mysql-bin",
        "--binlog-format=ROW",
        "--binlog-row-image=FULL",
        "--binlog-expire-logs-seconds=604800",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_0900_ai_ci",
      ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEMO_ADMIN_PASSWORD:-mysql123}
      MYSQL_DEMO_SOURCE_PASSWORD: ${MYSQL_DEMO_SOURCE_PASSWORD:-source123}
      MYSQL_DEMO_DESTINATION_PASSWORD: ${MYSQL_DEMO_DESTINATION_PASSWORD:-destination123}
    ports:
      - "127.0.0.1:${MYSQL_DEMO_PORT:-3307}:3306"
    volumes:
      - mysql-demo:/var/lib/mysql
    configs:
      - source: mysql-demo-init
        target: /docker-entrypoint-initdb.d/01-init.sh
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_DEMO_SOURCE_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u source_user -D cluecdc_source -Nse 'SELECT 1 FROM customers LIMIT 1' >/dev/null && MYSQL_PWD="$$MYSQL_DEMO_DESTINATION_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u destination_user -D cluecdc_destination -Nse 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    build:
      context: .
      dockerfile: infrastructure/docker/minio-test.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-bootstrap:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    entrypoint: ["python", "/fixture/bootstrap.py"]
    configs:
      - source: minio-init
        target: /fixture/bootstrap.py
    healthcheck:
      disable: true
    depends_on:
      minio:
        condition: service_healthy

  commerce-generator:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/docker/commerce-generator.Dockerfile
    environment:
      PGHOST: postgres-demo
      PGPORT: 5432
      PGDATABASE: cluecdc_source
      PGUSER: source_user
      PGPASSWORD: ${POSTGRES_DEMO_SOURCE_PASSWORD:-source123}
      PGSCHEMA: public
      MYSQL_HOST: mysql-demo
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cluecdc_source
      MYSQL_USER: source_user
      MYSQL_PASSWORD: ${MYSQL_DEMO_SOURCE_PASSWORD:-source123}
    depends_on:
      postgres-demo:
        condition: service_healthy
      mysql-demo:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-demo:
  mysql-demo:
  minio-data:

# Database init runs on empty data volumes; MinIO bootstrap is safe to rerun.
configs:
  postgres-demo-init:
    content: |
      \getenv source_password POSTGRES_DEMO_SOURCE_PASSWORD
      \getenv destination_password POSTGRES_DEMO_DESTINATION_PASSWORD
      CREATE ROLE source_user WITH LOGIN REPLICATION PASSWORD :'source_password';
      CREATE ROLE destination_user WITH LOGIN PASSWORD :'destination_password';
      CREATE DATABASE cluecdc_source OWNER source_user;
      CREATE DATABASE cluecdc_destination OWNER destination_user;
      \connect cluecdc_source
      GRANT CONNECT, CREATE ON DATABASE cluecdc_source TO source_user;
      GRANT USAGE, CREATE ON SCHEMA public TO source_user;
      SET ROLE source_user;
      CREATE TABLE customers (
        id bigserial PRIMARY KEY,
        name text NOT NULL,
        email text NOT NULL UNIQUE,
        updated_at timestamptz NOT NULL DEFAULT now()
      );
      CREATE TABLE orders (
        id bigserial PRIMARY KEY,
        customer_id bigint NOT NULL REFERENCES customers(id),
        total numeric(12,2) NOT NULL,
        status text NOT NULL DEFAULT 'pending',
        updated_at timestamptz NOT NULL DEFAULT now()
      );
      CREATE TABLE payments (
        id bigserial PRIMARY KEY,
        order_id bigint NOT NULL REFERENCES orders(id),
        amount numeric(12,2) NOT NULL,
        status text NOT NULL DEFAULT 'pending'
      );
      CREATE TABLE cars_unique (
        car_code text NOT NULL,
        model text NOT NULL,
        updated_at timestamptz NOT NULL DEFAULT now(),
        CONSTRAINT cars_unique_code UNIQUE (car_code)
      );
      CREATE TABLE keyless_events (
        event_type text NOT NULL,
        payload text,
        created_at timestamptz NOT NULL DEFAULT now()
      );
      CREATE TABLE composite_unique (
        tenant_id text NOT NULL,
        external_id text NOT NULL,
        payload text NOT NULL,
        CONSTRAINT composite_business_key UNIQUE (tenant_id, external_id)
      );
      CREATE TABLE nullable_unique (
        optional_code text,
        payload text NOT NULL,
        CONSTRAINT nullable_code_key UNIQUE (optional_code)
      );
      CREATE TABLE custom_key_probe (
        duplicate_code text NOT NULL,
        nullable_code text,
        payload text NOT NULL
      );
      ALTER TABLE customers REPLICA IDENTITY FULL;
      ALTER TABLE orders REPLICA IDENTITY FULL;
      ALTER TABLE payments REPLICA IDENTITY FULL;
      ALTER TABLE cars_unique REPLICA IDENTITY FULL;
      ALTER TABLE keyless_events REPLICA IDENTITY FULL;
      ALTER TABLE composite_unique REPLICA IDENTITY FULL;
      ALTER TABLE nullable_unique REPLICA IDENTITY FULL;
      ALTER TABLE custom_key_probe REPLICA IDENTITY FULL;
      INSERT INTO customers(name, email) VALUES ('Ada Lovelace', 'ada@example.test'), ('Grace Hopper', 'grace@example.test');
      INSERT INTO orders(customer_id, total) VALUES (1, 149.00), (2, 299.00);
      INSERT INTO payments(order_id, amount) VALUES (1, 149.00);
      INSERT INTO cars_unique(car_code, model) VALUES ('CAR-001', 'Roadster');
      INSERT INTO keyless_events(event_type, payload) VALUES ('seed', 'initial');
      INSERT INTO composite_unique(tenant_id, external_id, payload) VALUES ('tenant-a', 'external-1', 'seed');
      INSERT INTO nullable_unique(optional_code, payload) VALUES (NULL, 'nullable key');
      INSERT INTO custom_key_probe(duplicate_code, nullable_code, payload) VALUES ('duplicate', 'one', 'first'), ('duplicate', 'two', 'second'), ('other', NULL, 'null key');
      RESET ROLE;
      \connect cluecdc_destination
      GRANT CONNECT ON DATABASE cluecdc_destination TO destination_user;
      GRANT USAGE, CREATE ON SCHEMA public TO destination_user;
      CREATE SCHEMA analytics AUTHORIZATION destination_user;
      SET ROLE destination_user;
      CREATE TABLE public.customers (
        id bigint PRIMARY KEY,
        name text NOT NULL,
        email text NOT NULL,
        updated_at timestamptz NOT NULL
      );
      CREATE TABLE public.orders (
        id bigint PRIMARY KEY,
        customer_id bigint NOT NULL,
        total numeric(12,2) NOT NULL,
        status text NOT NULL,
        updated_at timestamptz NOT NULL
      );
  mysql-demo-init:
    content: |
      #!/bin/bash

      # The MySQL entrypoint sources non-executable *.sh files. Keep strict shell
      # options inside a subshell so they do not leak into the entrypoint process.
      (
      set -euo pipefail
      source_password_hex=$$(printf '%s' "$${MYSQL_DEMO_SOURCE_PASSWORD}" | od -An -tx1 | tr -d ' \n')
      destination_password_hex=$$(printf '%s' "$${MYSQL_DEMO_DESTINATION_PASSWORD}" | od -An -tx1 | tr -d ' \n')
      mysql --protocol=socket -uroot -p"$${MYSQL_ROOT_PASSWORD}" <<SQL
      SET @source_password = CONVERT(X'$${source_password_hex}' USING utf8mb4);
      SET @destination_password = CONVERT(X'$${destination_password_hex}' USING utf8mb4);
      SET @create_source_user = CONCAT('CREATE USER IF NOT EXISTS ''source_user''@''%'' IDENTIFIED BY ', QUOTE(@source_password));
      PREPARE create_source_user FROM @create_source_user;
      EXECUTE create_source_user;
      DEALLOCATE PREPARE create_source_user;
      SET @create_destination_user = CONCAT('CREATE USER IF NOT EXISTS ''destination_user''@''%'' IDENTIFIED BY ', QUOTE(@destination_password));
      PREPARE create_destination_user FROM @create_destination_user;
      EXECUTE create_destination_user;
      DEALLOCATE PREPARE create_destination_user;
      CREATE DATABASE IF NOT EXISTS cluecdc_source CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
      CREATE DATABASE IF NOT EXISTS cluecdc_destination CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
      GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'source_user'@'%';
      GRANT ALL PRIVILEGES ON cluecdc_source.* TO 'source_user'@'%';
      GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, DROP, INDEX ON cluecdc_destination.* TO 'destination_user'@'%';
      USE cluecdc_source;
      CREATE TABLE customers (
        id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        email VARCHAR(255) NOT NULL UNIQUE,
        active BOOLEAN NOT NULL DEFAULT TRUE,
        credit DECIMAL(30,6) NOT NULL DEFAULT 0,
        profile JSON NULL,
        avatar BLOB NULL,
        updated_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6)
      );
      CREATE TABLE orders (
        id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
        customer_id BIGINT UNSIGNED NOT NULL,
        total DECIMAL(18,4) NOT NULL,
        status ENUM('pending','paid','cancelled') NOT NULL DEFAULT 'pending',
        note TEXT NULL,
        ordered_at TIMESTAMP(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
        CONSTRAINT fk_orders_customer FOREIGN KEY (customer_id) REFERENCES customers(id)
      );
      CREATE TABLE order_items (
        id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,
        order_id BIGINT UNSIGNED NOT NULL,
        sku VARCHAR(80) NOT NULL,
        quantity INT UNSIGNED NOT NULL,
        price DECIMAL(18,4) NOT NULL,
        CONSTRAINT fk_items_order FOREIGN KEY (order_id) REFERENCES orders(id)
      );
      CREATE TABLE cars_unique (
        car_code VARCHAR(80) NOT NULL,
        model VARCHAR(255) NOT NULL,
        updated_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6)
          ON UPDATE CURRENT_TIMESTAMP(6),
        UNIQUE KEY cars_unique_code (car_code)
      );
      CREATE TABLE keyless_events (
        event_type VARCHAR(80) NOT NULL,
        payload TEXT NULL,
        created_at DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6)
      );
      CREATE TABLE composite_unique (
        tenant_id VARCHAR(32) NOT NULL,
        external_id VARCHAR(64) NOT NULL,
        payload VARCHAR(255) NOT NULL,
        UNIQUE KEY composite_business_key (tenant_id, external_id)
      );
      CREATE TABLE nullable_unique (
        optional_code VARCHAR(64) NULL,
        payload VARCHAR(255) NOT NULL,
        UNIQUE KEY nullable_code_key (optional_code)
      );
      CREATE TABLE custom_key_probe (
        duplicate_code VARCHAR(64) NOT NULL,
        nullable_code VARCHAR(64) NULL,
        payload VARCHAR(255) NOT NULL
      );
      INSERT INTO customers(name,email,credit,profile)
      SELECT CONCAT('Khách hàng ', n), CONCAT('customer', n, '@example.test'), n * 10.125,
             JSON_OBJECT('locale','vi-VN','note',IF(n=1,'Xin chào 👋',''))
      FROM (
        SELECT a.n + b.n * 10 + 1 AS n FROM
        (SELECT 0 n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) a
        CROSS JOIN
        (SELECT 0 n UNION ALL SELECT 1 UNION ALL SELECT 2 UNION ALL SELECT 3 UNION ALL SELECT 4 UNION ALL SELECT 5 UNION ALL SELECT 6 UNION ALL SELECT 7 UNION ALL SELECT 8 UNION ALL SELECT 9) b
      ) seed;
      INSERT INTO orders(customer_id,total,status,note)
      SELECT id, id * 3.1415, IF(id % 2 = 0,'paid','pending'), IF(id=1,'Đơn hàng đầu tiên','') FROM customers;
      INSERT INTO order_items(order_id,sku,quantity,price)
      SELECT id, CONCAT('SKU-',id), (id % 5) + 1, total FROM orders;
      INSERT INTO cars_unique(car_code,model) VALUES ('CAR-001','Roadster');
      INSERT INTO keyless_events(event_type,payload) VALUES ('seed','initial');
      INSERT INTO composite_unique(tenant_id,external_id,payload) VALUES ('tenant-a','external-1','seed');
      INSERT INTO nullable_unique(optional_code,payload) VALUES (NULL,'nullable key');
      INSERT INTO custom_key_probe(duplicate_code,nullable_code,payload) VALUES ('duplicate','one','first'),('duplicate','two','second'),('other',NULL,'null key');
      FLUSH PRIVILEGES;
      SQL
      )
  minio-init:
    content: |
      """Create the local integration bucket without depending on an mc registry image."""

      import os

      import boto3
      from botocore.exceptions import ClientError

      client = boto3.client(
          "s3",
          endpoint_url="http://minio:9000",
          region_name="us-east-1",
          aws_access_key_id=os.environ["MINIO_ROOT_USER"],
          aws_secret_access_key=os.environ["MINIO_ROOT_PASSWORD"],
      )
      try:
          client.head_bucket(Bucket="cluecdc-cdc")
      except ClientError as error:
          if error.response["ResponseMetadata"]["HTTPStatusCode"] != 404:
              raise
          client.create_bucket(Bucket="cluecdc-cdc")
      finally:
          client.close()
      print("MinIO integration bucket ready")
